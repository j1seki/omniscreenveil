name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: "appimage"
            artifacts: "appimage"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
            artifacts: "nsis"
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: "dmg"
            artifacts: "dmg"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview + X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config libx11-dev libappindicator3-dev

      - name: Swift static library (macOS)
        if: runner.os == 'macOS'
        run: |
          cd platform/macos
          swift build -c release

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build bundles
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          VEIL_MACOS_STATIC_LIB: ${{ github.workspace }}/platform/macos/.build/release/libVeilMac.a

      - name: Portable Windows build
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles nsis --config tauri.portable.conf.json
        env:
          VEIL_MACOS_STATIC_LIB: ${{ github.workspace }}/platform/macos/.build/release/libVeilMac.a

      - name: Portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "OmniScreenVeil.exe" target/${{ matrix.target }}/release -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "built exe not found" }
          $stage = "target/${{ matrix.target }}/release/portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "target/${{ matrix.target }}/release/OmniScreenVeil-portable-windows-x64.zip" -Force
          Write-Host "portable zip created"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
