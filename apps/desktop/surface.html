<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniScreenVeil Surface</title>
    <style>body { margin: 0; background: #0b0d12; color: #bcc3d1; font: 14px system-ui; } #boot { padding: 16px; }</style>
  </head>
  <body>
    <div id="root"><p id="boot" role="status">Starting Veil Surface…</p></div>
    <script>
      window.addEventListener("error", () => {
        const status = document.getElementById("boot");
        if (status) status.textContent = "The Surface interface could not load. Close this window and try opening it again.";
      }, true);
    </script>
    <script type="module" src="/src/surface-entry.tsx"></script>
  </body>
</html>
